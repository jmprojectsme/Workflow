<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0f2236"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6ad55"/>
      <stop offset="100%" stop-color="#ed8936"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="36" fill="url(#bg)"/>
  <!-- Ledger lines decorative -->
  <rect x="28" y="56" width="136" height="3" rx="1.5" fill="#ffffff" opacity="0.07"/>
  <rect x="28" y="70" width="136" height="3" rx="1.5" fill="#ffffff" opacity="0.07"/>
  <rect x="28" y="84" width="136" height="3" rx="1.5" fill="#ffffff" opacity="0.07"/>
  <!-- W letter bold -->
  <text x="96" y="128" font-family="Georgia, serif" font-weight="700" font-size="88" fill="white" text-anchor="middle" letter-spacing="-4">W</text>
  <!-- Accent underline bar -->
  <rect x="38" y="148" width="116" height="7" rx="3.5" fill="url(#accent)"/>
  <!-- Small checkmark dot top-right -->
  <circle cx="152" cy="44" r="16" fill="url(#accent)"/>
  <text x="152" y="50" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">✓</text>
</svg>
